name: Compilar APK de Flet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias de Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Compilar APK
        run: |
          # 1. Localizar dónde está main.py en cualquier subcarpeta
          MAIN_PATH=$(find . -name "main.py" -not -path "*/.*" | head -n 1)
          echo "Archivo encontrado en: $MAIN_PATH"

          # 2. Si no está en la raíz, copiarlo a la raíz
          if [ "$MAIN_PATH" != "./main.py" ]; then
            cp "$MAIN_PATH" ./main.py
          fi

          # 3. Si hay carpeta assets, copiarla a la raíz
          ASSETS_PATH=$(find . -type d -name "assets" -not -path "*/.*" | head -n 1)
          if [ -n "$ASSETS_PATH" ] && [ "$ASSETS_PATH" != "./assets" ]; then
            cp -r "$ASSETS_PATH" ./assets || true
          fi

          # 4. Compilar a APK
          flet build apk --yes

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MiCalculadoraAPK
          path: "**/*.apk"
