name: Compilar APK de Flet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias de Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Sincronizar archivos del proyecto
        run: |
          MAIN_FILE=$(find . -name "main.py" -not -path "*/.*" | head -n 1)
          echo "Archivo encontrado en: $MAIN_FILE"

          mkdir -p src
          if [ "$MAIN_FILE" != "./src/main.py" ] && [ "$MAIN_FILE" != "src/main.py" ]; then
            cp -f "$MAIN_FILE" src/main.py
          fi

          if [ "$MAIN_FILE" != "./main.py" ] && [ "$MAIN_FILE" != "main.py" ]; then
            cp -f "$MAIN_FILE" ./main.py
          fi

          if [ -d "assets" ] && [ ! -d "src/assets" ]; then
            cp -r assets src/
          elif [ -d "src/assets" ] && [ ! -d "assets" ]; then
            cp -r src/assets .
          fi

      - name: Compilar APK
        run: |
          # 1. Crear monitor en Python para neutralizar la incompatibilidad de jni
          cat << 'EOF' > fix_jni.py
          import os, time

          patch_code = """
          const actualMajorVersion = 1;
          const actualMinorVersion = 99;
          const actualPatchVersion = 0;
          bool jni$_jniVersionCheck(int major, int minor) => true;
          """

          pub_caches = [
              os.path.expanduser('~/.pub-cache'),
              '/home/runner/.pub-cache',
          ]

          while True:
              for base in pub_caches:
                  if os.path.exists(base):
                      for root, dirs, files in os.walk(base):
                          if 'version_check.dart' in files:
                              p = os.path.join(root, 'version_check.dart')
                              try:
                                  with open(p, 'r') as f:
                                      c = f.read()
                                  if 'actualMinorVersion = 99' not in c:
                                      with open(p, 'w') as f:
                                          f.write(patch_code)
                                      print(f"Parcheado aplicado con éxito en: {p}", flush=True)
                              except Exception:
                                  pass
                          if 'generated_plugin.dart' in files:
                              p = os.path.join(root, 'generated_plugin.dart')
                              try:
                                  with open(p, 'r') as f:
                                      c = f.read()
                                  if 'jni$_jniVersionCheck(1, 1)' in c:
                                      c = c.replace('jni$_jniVersionCheck(1, 1)', 'true')
                                      with open(p, 'w') as f:
                                          f.write(c)
                                      print(f"Parcheado plugin en: {p}", flush=True)
                              except Exception:
                                  pass
              time.sleep(0.5)
          EOF

          # 2. Iniciar el monitor en segundo plano
          python3 fix_jni.py &
          MONITOR_PID=$!

          # 3. Compilar APK
          flet build apk --yes

          # 4. Detener el monitor
          kill $MONITOR_PID 2>/dev/null || true

      - name: Firmar el archivo APK
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Herramienta de firma: $APKSIGNER"

          for apk in $(find . -name "*.apk" -not -path "*/.*"); do
            echo "Firmando $apk..."
            $APKSIGNER sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey "$apk"
            $APKSIGNER verify "$apk"
          done
          echo "APK firmado y verificado exitosamente."

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MiCalculadoraAPK
          path: "**/*.apk"
