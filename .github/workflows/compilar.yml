name: Compilar APK de Flet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias de Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Sincronizar archivos del proyecto
        run: |
          # 1. Localizar el archivo main.py
          MAIN_FILE=$(find . -name "main.py" -not -path "*/.*" | head -n 1)
          echo "Copiando $MAIN_FILE a todas las ubicaciones posibles..."

          # 2. Asegurar que main.py exista tanto en la raíz como en src/
          mkdir -p src
          cp "$MAIN_FILE" ./main.py
          cp "$MAIN_FILE" ./src/main.py

          # 3. Asegurar que la carpeta assets exista en ambos lados
          if [ -d "src/assets" ]; then
            cp -r src/assets . 2>/dev/null || true
          elif [ -d "assets" ]; then
            cp -r assets src/ 2>/dev/null || true
          fi

      - name: Compilar APK
        run: |
          flet build apk --yes

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MiCalculadoraAPK
          path: "**/*.apk"
