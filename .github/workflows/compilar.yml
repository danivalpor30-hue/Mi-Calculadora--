name: Compilar APK de Flet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias de Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Sincronizar archivos del proyecto
        run: |
          # 1. Localizar main.py
          MAIN_FILE=$(find . -name "main.py" -not -path "*/.*" | head -n 1)
          echo "Archivo encontrado en: $MAIN_FILE"

          # 2. Asegurar que exista dentro de src/ (sin sobrescribirse a sí mismo)
          mkdir -p src
          if [ "$MAIN_FILE" != "./src/main.py" ] && [ "$MAIN_FILE" != "src/main.py" ]; then
            cp -f "$MAIN_FILE" src/main.py
          fi

          # 3. Asegurar que exista en la raíz (sin sobrescribirse a sí mismo)
          if [ "$MAIN_FILE" != "./main.py" ] && [ "$MAIN_FILE" != "main.py" ]; then
            cp -f "$MAIN_FILE" ./main.py
          fi

          # 4. Asegurar los iconos y recursos si existen
          if [ -d "assets" ] && [ ! -d "src/assets" ]; then
            cp -r assets src/
          elif [ -d "src/assets" ] && [ ! -d "assets" ]; then
            cp -r src/assets .
          fi

      - name: Compilar APK
        run: |
          flet build apk --yes

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MiCalculadoraAPK
          path: "**/*.apk"
