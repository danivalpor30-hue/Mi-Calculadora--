name: Compilar APK de Flet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias de Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Sincronizar archivos del proyecto
        run: |
          MAIN_FILE=$(find . -name "main.py" -not -path "*/.*" | head -n 1)
          echo "Archivo encontrado en: $MAIN_FILE"

          mkdir -p src
          if [ "$MAIN_FILE" != "./src/main.py" ] && [ "$MAIN_FILE" != "src/main.py" ]; then
            cp -f "$MAIN_FILE" src/main.py
          fi

          if [ "$MAIN_FILE" != "./main.py" ] && [ "$MAIN_FILE" != "main.py" ]; then
            cp -f "$MAIN_FILE" ./main.py
          fi

          if [ -d "assets" ] && [ ! -d "src/assets" ]; then
            cp -r assets src/
          elif [ -d "src/assets" ] && [ ! -d "assets" ]; then
            cp -r src/assets .
          fi

      - name: Compilar APK
        run: |
          # 1. Iniciar vigilante en segundo plano para neutralizar el conflicto de jni_flutter
          (
            while true; do
              if [ -d "$HOME/.pub-cache" ]; then
                find "$HOME/.pub-cache" -name "version_check.dart" -exec sed -i 's/actualMinorVersion == minor/true/g' {} + 2>/dev/null || true
                find "$HOME/.pub-cache" -name "generated_plugin.dart" -exec sed -i 's/jni\$_jniVersionCheck(1, 1)/true/g' {} + 2>/dev/null || true
              fi
              sleep 2
            done
          ) &
          WATCHER_PID=$!

          # 2. Compilar APK con Flet
          flet build apk --yes

          # 3. Detener el vigilante
          kill $WATCHER_PID 2>/dev/null || true

      - name: Firmar el archivo APK
        run: |
          # Crear certificado de depuración para permitir instalación directa
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Herramienta de firma: $APKSIGNER"

          for apk in $(find . -name "*.apk" -not -path "*/.*"); do
            echo "Firmando $apk..."
            $APKSIGNER sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey "$apk"
            $APKSIGNER verify "$apk"
          done
          echo "APK firmado exitosamente."

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MiCalculadoraAPK
          path: "**/*.apk"
