name: Compilar APK de Flet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias de Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Sincronizar archivos del proyecto
        run: |
          MAIN_FILE=$(find . -name "main.py" -not -path "*/.*" | head -n 1)
          echo "Archivo encontrado en: $MAIN_FILE"

          mkdir -p src
          if [ "$MAIN_FILE" != "./src/main.py" ] && [ "$MAIN_FILE" != "src/main.py" ]; then
            cp -f "$MAIN_FILE" src/main.py
          fi

          if [ "$MAIN_FILE" != "./main.py" ] && [ "$MAIN_FILE" != "main.py" ]; then
            cp -f "$MAIN_FILE" ./main.py
          fi

          if [ -d "assets" ] && [ ! -d "src/assets" ]; then
            cp -r assets src/
          elif [ -d "src/assets" ] && [ ! -d "assets" ]; then
            cp -r src/assets .
          fi

      - name: Compilar APK
        run: |
          # Proceso en segundo plano para resolver la incompatibilidad de versiones entre jni y jni_flutter
          (
            while true; do
              # 1. Si Flet genera un pubspec.yaml con jni bloqueado en 1.0.0, permitir versiones superiores
              find /tmp /home/runner build . -name "pubspec.yaml" 2>/dev/null | while read f; do
                if grep -q "jni: 1.0.0" "$f" 2>/dev/null; then
                  sed -i 's/jni: 1.0.0/jni: ^1.1.0/g' "$f"
                fi
              done

              # 2. Si jni-1.0.0 ya fue descargado, neutralizar la aserción que detiene el compilador de Dart
              VCHECK=$(find /home/runner/.pub-cache -name "version_check.dart" 2>/dev/null | grep "jni" | head -n 1)
              if [ -n "$VCHECK" ]; then
                sed -i 's/actualMinorVersion >= minor/true/g' "$VCHECK"
                echo "Parche de compatibilidad aplicado en: $VCHECK"
                break
              fi
              sleep 1
            done
          ) &

          flet build apk --yes

      - name: Firmar el archivo APK
        run: |
          # 1. Crear el certificado de firma de desarrollo
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

          # 2. Localizar apksigner oficial de Android SDK
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Herramienta de firma: $APKSIGNER"

          # 3. Firmar todos los APKs generados
          for apk in $(find . -name "*.apk" -not -path "*/.*"); do
            echo "Firmando $apk..."
            $APKSIGNER sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey "$apk"
            $APKSIGNER verify "$apk"
          done
          echo "¡APKs firmados correctamente!"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MiCalculadoraAPK
          path: "**/*.apk"
