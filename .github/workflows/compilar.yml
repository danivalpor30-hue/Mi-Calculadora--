name: Compilar APK de Flet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias de Android
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Compilar APK
        run: |
          # Desactiva pipefail para que la tubería de 'yes' responda automáticamente al prompt sin dar error de salida
          set +o pipefail
          if [ -d "src" ]; then
            yes y | flet build apk src --project mi_calculadora
          else
            yes y | flet build apk --project mi_calculadora
          fi
          set -o pipefail

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MiCalculadoraAPK
          path: build/apk/*.apk
